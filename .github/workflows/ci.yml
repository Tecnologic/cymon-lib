name: CI
on:
  push:
    branches: [main, develop, "claude/**", "copilot/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build clang clang-tidy

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build (warnings are errors)
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: clang-tidy
        if: matrix.compiler == 'clang++'
        run: clang-tidy -p build --warnings-as-errors='*' src/cymon/*.cpp

  format-and-dsdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install clang-format==22.1.1 "nunavut>=2.3,<3"
      - name: clang-format
        run: git ls-files '*.hpp' '*.cpp' | xargs clang-format --dry-run --Werror
      - name: DSDL and generated C serialization
        run: scripts/check_dsdl.sh
